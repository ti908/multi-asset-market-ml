history:
  start_date: "2015-01-01"
  interval: "1d"

cache:
  ttl_hours: 24
  format: "parquet"

retry:
  max_attempts: 3
  initial_delay_seconds: 2.0
  backoff_multiplier: 2.0

providers:
  twelve_data:
    base_url: "https://api.twelvedata.com"
    api_key_env: "TWELVE_DATA_API_KEY"
    timeout_seconds: 10.0

  alpha_vantage:
    base_url: "https://www.alphavantage.co/query"
    api_key_env: "ALPHA_VANTAGE_API_KEY"
    timeout_seconds: 30.0

news:
  providers:
    gdelt:
      enabled: true
      base_url: "https://data.gdeltproject.org/gdeltv2"
      request_delay_seconds: 1.0

    marketaux:
      enabled: true
      base_url: "https://api.marketaux.com/v1"
      api_key_env: "MARKETAUX_API_TOKEN"
      request_delay_seconds: 1.0

  queries:
    AAPL:
      - query_id: "aapl_company"
        strict_terms:
          - "AAPL"
          - "Apple Inc"
        context_terms: []

    MSFT:
      - query_id: "msft_company"
        strict_terms:
          - "MSFT"
          - "Microsoft"
          - "Microsoft Corporation"
        context_terms: []

    BTC_USD:
      - query_id: "btc_asset"
        strict_terms:
          - "Bitcoin"
        context_terms:
          - "BTC"
          - "crypto"
          - "cryptocurrency"

    EURUSD:
      - query_id: "eurusd_pair"
        strict_terms:
          - "EUR/USD"
          - "EURUSD"
        context_terms:
          - "euro"
          - "dollar"
          - "USD"
          - "forex"
          - "currency"

    GOLD:
      - query_id: "gold_market"
        strict_terms:
          - "gold price"
          - "gold prices"
          - "bullion"
          - "XAUUSD"
        context_terms:
          - "gold"
          - "XAU"
          - "commodity"
          - "futures"

  availability:
    equity:
      strategy: "session_cutoff"

    crypto:
      strategy: "utc_cutoff"

    forex:
      strategy: "forex_24_5_cutoff"

    commodity:
      strategy: "session_cutoff"

  validation:
    allowed_languages:
      - "en"
    require_title: true
    require_canonical_url: true
    max_future_seconds: 0

validation:
  asset_classes:
    equity:
      large_daily_move_threshold: 0.20
      volume_spike_multiplier: 5.0
      volume_rolling_window: 20
      max_missing_sessions: 2
      check_zero_volume: true
      calendar: XNYS
      closed_dates: [ ]

    crypto:
      large_daily_move_threshold: 0.40
      volume_spike_multiplier: 8.0
      volume_rolling_window: 20
      max_missing_sessions: 1
      check_zero_volume: true
      calendar: 24/7
      closed_dates: [ ]

    forex:
      large_daily_move_threshold: 0.05
      volume_spike_multiplier: 5.0
      volume_rolling_window: 20
      max_missing_sessions: 2
      check_zero_volume: false
      calendar: 24/5
      closed_dates: [ ]

    commodity:
      large_daily_move_threshold: 0.15
      volume_spike_multiplier: 6.0
      volume_rolling_window: 20
      max_missing_sessions: 2
      check_zero_volume: true
      calendar: COMEX
      closed_dates: [ ]

paths:
  raw: "data/raw"
  cache: "data/cache"
  processed: "data/processed"
  synthetic: "data/synthetic"
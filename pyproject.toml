[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-asset-market-ml"
version = "0.1.0"
description = "Multi-asset market prediction ML portfolio project for Afrotech 2026."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pandas>=2.2,<3.0",
    "pydantic>=2.7,<3.0",
    "PyYAML>=6.0,<7.0",
    "yfinance>=0.2,<2.0",
    "exchange-calendars>=4,<5",
    "pyarrow>=20,<27"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0"
]

sentiment = [
    "torch==2.15.0",
    "transformers==4.57.6",
    "vaderSentiment==3.3.2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
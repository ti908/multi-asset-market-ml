[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-asset-market-ml"
version = "0.1.0"
description = "Multi-asset market prediction ML portfolio project for Afrotech 2026."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.7,<3.0",
    "PyYAML>=6.0,<7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"